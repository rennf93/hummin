site_name: hummin
site_description: A GLM-native terminal coding agent - local inference first
site_url: https://rennf93.github.io/hummin/
repo_name: rennf93/hummin
repo_url: https://github.com/rennf93/hummin
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo-mark.png
  favicon: assets/logo-mark.png

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart (Z.ai cloud): getting-started/quickstart.md
  - Local Models:
    - Overview: local-models/index.md
    - Downloading Models: local-models/downloading.md
    - Serving with llama.cpp: local-models/serving-llamacpp.md
    - Serving with colibri: local-models/serving-colibri.md
    - Connecting to hummin: local-models/fleet.md
    - Keeping Servers Running: local-models/operations.md
    - Troubleshooting: local-models/troubleshooting.md
  - Features:
    - Agent Teamwork: features/teamwork.md
    - Memory: features/memory.md
    - Safety: features/safety.md
    - Integrations: features/integrations.md
    - Sessions: features/sessions.md
  - Reference:
    - Slash Commands: reference/commands.md
    - Configuration: reference/configuration.md
    - Server Templates: reference/templates.md
    - Measured Performance: reference/performance.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rennf93/hummin

  generator: false
  meta:
    - property: og:type
      content: website
    - property: og:title
      content: hummin - GLM-native terminal coding agent
    - property: og:description
      content: A GLM-native terminal coding agent with first-class local inference via colibri and llama.cpp
  author:
    name: Renzo Franceschini
    url: https://github.com/rennf93

copyright: hummin is MIT licensed. Based on <a href="https://github.com/earendil-works/pi">pi</a> by Mario Zechner / earendil-works.
