name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fd ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The build regenerates model data from live models.dev/OpenRouter metadata.
      # Fail here, with the diff in the log, when upstream metadata drifted from the
      # committed copy instead of failing later inside a model-catalog test.
      # openrouter.json is excluded: models.dev re-ingests OpenRouter (mostly
      # pricing) continuously, so it churns daily and carries no test assertions.
      # Fix on drift: run `npm run generate:models` locally and commit the diff.
      - name: Model data drift
        run: |
          git diff --exit-code -- packages/ai/src/models.generated.ts 'packages/ai/src/providers/data/' ':(exclude)packages/ai/src/providers/data/.manifest.json' ':(exclude)packages/ai/src/providers/data/openrouter.json' \
            || { echo "::error::Generated model data drifted from the committed copy (upstream metadata changed). Run 'npm run generate:models' locally and commit the diff."; git diff --stat -- packages/ai/src/models.generated.ts 'packages/ai/src/providers/data/' ':(exclude)packages/ai/src/providers/data/.manifest.json' ':(exclude)packages/ai/src/providers/data/openrouter.json'; exit 1; }

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Extension load smoke
        run: node scripts/check-extensions-load.mjs
