name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    # hummin overlay: macOS keeps build, check and the drift step, as before upstream's split.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # The build regenerates model data from live models.dev/OpenRouter metadata.
      # Fail here, with the diff in the log, when upstream metadata drifted from the
      # committed copy instead of failing later inside a model-catalog test.
      # openrouter.json is excluded: models.dev re-ingests OpenRouter (mostly
      # pricing) continuously, so it churns daily and carries no test assertions.
      # Fix on drift: run `npm run generate:models` locally and commit the diff.
      # Excluded as chronically volatile: their upstream catalogs re-ingest
      # pricing/metadata continuously (models.dev re-ingests OpenRouter daily;
      # Vercel, Bedrock, Mistral and OpenCode mutate within minutes to hours), and the
      # drift carries no test assertions. Fix on drift: run
      # `npm run generate:models` locally and commit the diff.
      - name: Model data drift
        run: |
          git diff --exit-code -- packages/ai/src/models.generated.ts 'packages/ai/src/providers/data/' ':(exclude)packages/ai/src/providers/data/.manifest.json' ':(exclude)packages/ai/src/providers/data/openrouter.json' ':(exclude)packages/ai/src/providers/data/opencode.json' ':(exclude)packages/ai/src/providers/data/opencode-go.json' ':(exclude)packages/ai/src/providers/data/mistral.json' ':(exclude)packages/ai/src/providers/data/vercel-ai-gateway.json' ':(exclude)packages/ai/src/providers/data/amazon-bedrock.json' \
            || { echo "::error::Generated model data drifted from the committed copy (upstream metadata changed). Run 'npm run generate:models' locally and commit the diff."; git diff --stat -- packages/ai/src/models.generated.ts 'packages/ai/src/providers/data/' ':(exclude)packages/ai/src/providers/data/.manifest.json' ':(exclude)packages/ai/src/providers/data/openrouter.json' ':(exclude)packages/ai/src/providers/data/opencode.json' ':(exclude)packages/ai/src/providers/data/opencode-go.json' ':(exclude)packages/ai/src/providers/data/mistral.json' ':(exclude)packages/ai/src/providers/data/vercel-ai-gateway.json' ':(exclude)packages/ai/src/providers/data/amazon-bedrock.json'; exit 1; }

      # Previews are published for main and PRs from branches of this repo only (see preview-packages.yml).
      - name: Pack preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pull request runs check out a merge commit; tarballs are keyed by the PR head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      - name: Check
        run: npm run check

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # hummin overlay: macOS coverage on top of upstream's suite split.
        os: [ubuntu-latest, macos-15]
        name: [coding-agent, durable, other]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies (Linux)
        if: matrix.name != 'durable' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install system dependencies (macOS)
        if: matrix.name != 'durable' && runner.os == 'macOS'
        run: brew install fd ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"

      - name: Extension load smoke
        run: node scripts/check-extensions-load.mjs

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs the MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
